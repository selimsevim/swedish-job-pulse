name: Update job data

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      backfill_weeks:
        description: 'Optional one-time bootstrap: number of previous weekly snapshots to backfill before collecting the current week'
        required: false
        default: '0'

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-ml.txt

      - name: Backfill historical snapshots
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.backfill_weeks != '0'
        run: python scripts/backfill.py ${{ github.event.inputs.backfill_weeks }}

      - name: Collect data
        run: python scripts/collect.py

      - name: Rebuild Career Reality Check artifacts
        run: ./scripts/rebuild_career_reality.sh

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Weekly update $(date -u +%G-W%V)"
          git push
